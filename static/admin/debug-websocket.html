<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket 调试工具</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #00ff00;
            border-bottom: 2px solid #00ff00;
            padding-bottom: 10px;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            background: #2a2a2a;
            border: 1px solid #00ff00;
            border-radius: 5px;
        }
        .message {
            margin: 5px 0;
            padding: 10px;
            background: #1a1a1a;
            border-left: 3px solid #00ff00;
            word-wrap: break-word;
        }
        .message.error {
            border-left-color: #ff0000;
            color: #ff0000;
        }
        .message.warning {
            border-left-color: #ffff00;
            color: #ffff00;
        }
        .message.info {
            border-left-color: #00ffff;
            color: #00ffff;
        }
        .timestamp {
            color: #888;
            font-size: 0.9em;
        }
        button {
            background: #00ff00;
            color: #1a1a1a;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }
        button:hover {
            background: #00cc00;
        }
        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 3px;
            font-weight: bold;
        }
        .status.connected {
            background: #00ff00;
            color: #1a1a1a;
        }
        .status.disconnected {
            background: #ff0000;
            color: #fff;
        }
        pre {
            background: #0a0a0a;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 WebSocket 调试工具 - 后台状态同步检查</h1>
        
        <div class="section">
            <h2>连接状态</h2>
            <p>WebSocket: <span id="ws-status" class="status disconnected">未连接</span></p>
            <button onclick="connect()">连接</button>
            <button onclick="disconnect()">断开</button>
            <button onclick="clearMessages()">清空日志</button>
        </div>

        <div class="section">
            <h2>测试操作</h2>
            <p>在前端页面执行以下操作，观察是否收到 roomStateChanged 消息：</p>
            <button onclick="testVolumeUp()">测试：音量+</button>
            <button onclick="testLight()">测试：灯光切换</button>
            <button onclick="testAc()">测试：空调温度+</button>
            <button onclick="testEffect()">测试：音效切换</button>
        </div>

        <div class="section">
            <h2>接收到的消息 <span id="message-count" style="color: #ffff00;">(0)</span></h2>
            <div id="messages"></div>
        </div>
    </div>

    <script src="/vod_song/shared/websocket/websocket-client.js"></script>
    <script>
        let ws = null;
        let messageCount = 0;

        function log(message, type = 'info') {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const timestamp = new Date().toLocaleTimeString('zh-CN', { hour12: false, fractionalSecondDigits: 3 });
            messageDiv.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;
            
            messagesDiv.insertBefore(messageDiv, messagesDiv.firstChild);
            
            messageCount++;
            document.getElementById('message-count').textContent = `(${messageCount})`;
        }

        function connect() {
            if (ws) {
                log('WebSocket 已连接', 'warning');
                return;
            }

            log('正在连接 WebSocket...', 'info');
            
            ws = window.WebSocketClient;
            
            if (!ws) {
                log('WebSocketClient 未加载！', 'error');
                return;
            }

            // 监听连接状态
            ws.on('connected', () => {
                log('✅ WebSocket 已连接', 'info');
                document.getElementById('ws-status').textContent = '已连接';
                document.getElementById('ws-status').className = 'status connected';
            });

            ws.on('disconnected', () => {
                log('❌ WebSocket 已断开', 'error');
                document.getElementById('ws-status').textContent = '未连接';
                document.getElementById('ws-status').className = 'status disconnected';
            });

            // 监听所有消息
            ws.onAny((type, data) => {
                log(`📨 收到消息类型: <strong>${type}</strong>`, 'info');
                log(`<pre>${JSON.stringify(data, null, 2)}</pre>`, 'info');
            });

            // 特别监听 roomStateChanged
            ws.on('roomStateChanged', (data) => {
                log('🎯 收到 roomStateChanged 消息！', 'warning');
                log(`<pre>${JSON.stringify(data, null, 2)}</pre>`, 'warning');
                
                // 检查数据结构
                if (data.roomId) {
                    log(`✓ roomId: ${data.roomId}`, 'info');
                }
                if (data.data) {
                    log(`✓ data 字段存在`, 'info');
                    if (data.data.roomId) log(`  - data.roomId: ${data.data.roomId}`, 'info');
                    if (data.data.ac) log(`  - data.ac: ${JSON.stringify(data.data.ac)}`, 'info');
                    if (data.data.light) log(`  - data.light: ${JSON.stringify(data.data.light)}`, 'info');
                    if (data.data.effect) log(`  - data.effect: ${JSON.stringify(data.data.effect)}`, 'info');
                    if (data.data.volume !== undefined) log(`  - data.volume: ${data.data.volume}`, 'info');
                }
            });

            // 初始化连接
            if (ws.getConnectionStatus() === 'connected') {
                log('✅ WebSocket 已连接（初始状态）', 'info');
                document.getElementById('ws-status').textContent = '已连接';
                document.getElementById('ws-status').className = 'status connected';
            }
        }

        function disconnect() {
            if (ws) {
                log('断开 WebSocket 连接', 'warning');
                ws = null;
            }
        }

        function clearMessages() {
            document.getElementById('messages').innerHTML = '';
            messageCount = 0;
            document.getElementById('message-count').textContent = '(0)';
            log('日志已清空', 'info');
        }

        async function testVolumeUp() {
            try {
                log('发送测试请求：音量+', 'warning');
                const response = await fetch('/api/v1/rooms/current/peripheral/voice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ voice_type: 4, val: 50 })
                });
                const result = await response.json();
                log(`API 响应: ${response.status}`, result.code === 0 ? 'info' : 'error');
                log(`<pre>${JSON.stringify(result, null, 2)}</pre>`, 'info');
            } catch (error) {
                log(`API 调用失败: ${error.message}`, 'error');
            }
        }

        async function testLight() {
            try {
                log('发送测试请求：灯光切换', 'warning');
                const response = await fetch('/api/v1/rooms/current/peripheral/light', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ scene: '1' })
                });
                const result = await response.json();
                log(`API 响应: ${response.status}`, result.code === 0 ? 'info' : 'error');
                log(`<pre>${JSON.stringify(result, null, 2)}</pre>`, 'info');
            } catch (error) {
                log(`API 调用失败: ${error.message}`, 'error');
            }
        }

        async function testAc() {
            try {
                log('发送测试请求：空调温度+', 'warning');
                const response = await fetch('/api/v1/rooms/current/peripheral/ac', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ power: true, temp: 27 })
                });
                const result = await response.json();
                log(`API 响应: ${response.status}`, result.code === 0 ? 'info' : 'error');
                log(`<pre>${JSON.stringify(result, null, 2)}</pre>`, 'info');
            } catch (error) {
                log(`API 调用失败: ${error.message}`, 'error');
            }
        }

        async function testEffect() {
            try {
                log('发送测试请求：音效切换', 'warning');
                const response = await fetch('/api/v1/rooms/current/peripheral/effect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: 'ktv' })
                });
                const result = await response.json();
                log(`API 响应: ${response.status}`, result.code === 0 ? 'info' : 'error');
                log(`<pre>${JSON.stringify(result, null, 2)}</pre>`, 'info');
            } catch (error) {
                log(`API 调用失败: ${error.message}`, 'error');
            }
        }

        // 页面加载时自动连接
        window.addEventListener('DOMContentLoaded', () => {
            log('页面加载完成，等待 WebSocketClient 初始化...', 'info');
            setTimeout(() => {
                connect();
            }, 1000);
        });
    </script>
</body>
</html>
