    <!-- 强制保持深色模式 -->
    <script>
        (function () {
            // 立即添加 dark 类到 html 元素
            function forceDarkMode() {
                if (document.documentElement) {
                    document.documentElement.classList.add('dark');
                }
            }

            // 执行一次
            forceDarkMode();

            // DOM 完成后再确认一次
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', forceDarkMode);
            } else {
                forceDarkMode();
            }

            // 使用 MutationObserver 防止 dark 类被移除
            if (typeof MutationObserver !== 'undefined') {
                const observer = new MutationObserver(function (mutations) {
                    mutations.forEach(function (mutation) {
                        if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
                            const target = mutation.target;
                            if (target === document.documentElement && !target.classList.contains('dark')) {
                                // 强制重新添加 dark 类
                                target.classList.add('dark');
                            }
                        }
                    });
                });

                // 开始观察
                if (document.documentElement) {
                    observer.observe(document.documentElement, {
                        attributes: true,
                        attributeFilter: ['class']
                    });
                }

                // 将 observer 保存到全局，防止被垃圾回收
                window.__darkModeObserver = observer;
            }
        })();
    </script>

    <!-- 提前安装全局日志捕获 shim：在任何脚本运行前拦截所有 console 调用并入队，等待 LogService 统一输出 -->
    <script>
        (function () {
            if (window.__logShimInstalled) return;
            window.__logShimInstalled = true;
            var c = window.console || {};
            // 保存原生 console 方法，供日志系统使用，避免递归
            var raw = {
                log: c.log ? c.log.bind(c) : function () { },
                info: c.info ? c.info.bind(c) : function () { },
                warn: c.warn ? c.warn.bind(c) : function () { },
                error: c.error ? c.error.bind(c) : function () { },
                debug: c.debug ? c.debug.bind(c) : function () { },
                count: c.count ? c.count.bind(c) : null
            };
            window.__rawConsole = raw;
            // 早期日志队列
            window.__earlyLogs = window.__earlyLogs || [];

            // 代理：不做格式化、不直接输出，只入队，等待 LogService 接管后统一处理
            function proxy(level) {
                return function () {
                    var args = Array.prototype.slice.call(arguments);
                    var stack;
                    if (level === 'error') {
                        try { stack = (new Error()).stack; } catch (_) { stack = undefined; }
                    }
                    window.__earlyLogs.push({ level: level, args: args, ts: Date.now(), stack: stack });
                };
            }

            // 重写全局 console，确保所有日志都先进入队列
            window.console = {
                log: proxy('info'), // 统一按 info 处理
                info: proxy('info'),
                warn: proxy('warn'),
                error: proxy('error'),
                debug: proxy('debug'),
                count: raw.count || function () { }
            };
        })();
    </script>

    <script>
        // 禁用双击/双指缩放（iOS 适配强制覆盖）
        (function () {
            let lastTouchEnd = 0;
            // 拦截 touchend 事件防止三连击缩放
            document.addEventListener('touchend', function (e) {
                const now = Date.now();
                if (now - lastTouchEnd <= 300 && e.cancelable) {
                    e.preventDefault();
                }
                lastTouchEnd = now;
            }, { passive: false });
            // 拦截双击
            document.addEventListener('dblclick', function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
            // iOS Safari 手势缩放
            document.addEventListener('gesturestart', function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
            document.addEventListener('gesturechange', function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
            document.addEventListener('gestureend', function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });
        })();
    </script>

    <script>
        // 设备类型检测函数
        function detectDevice() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // 检测安卓设备
            const isAndroid = /android/i.test(userAgent);

            // 检测 iOS 设备
            const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

            // 检测移动端
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(userAgent);

            // 为 body 应用对应的 class
            if (isAndroid) {
                document.body.classList.add('android-device');
            }

            if (isIOS) {
                document.body.classList.add('ios-device');
            }

            if (isMobile) {
                document.body.classList.add('mobile-device');
            }
        }

        // 页面初始化时执行一次
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function () {
                detectDevice();
            });
        } else {
            detectDevice();
        }

        // 通过 viewport 缩放保护，禁止双指放大。
        // 去除全局 touchstart/touchmove 监听以保持 Android 滚动流畅性。
    </script>

    <!-- ====== 静态资源加载策略 ====== -->
    <!-- 策略说明：
       1. 关键样式 CSS：同步加载，确保页面样式不闪烁
       2. JS 模块：延迟加载（defer），配合后台启动优化
       3. 关键图片：异步预加载，加速首页渲染
       4. 非关键样式：异步延迟加载（ media="print" 技巧 ）
    -->

    <script>
        (function () {
            var viewportRafId = 0;
            function setVh() {
                var h = (window.visualViewport && window.visualViewport.height > 100 && window.visualViewport.height)
                    || (window.innerHeight > 100 && window.innerHeight)
                    || (document.documentElement.clientHeight > 100 && document.documentElement.clientHeight)
                    || window.screen.height
                    || 667;
                document.documentElement.style.setProperty('--app-vh', (h * 0.01) + 'px');
            }
            function scheduleSetVh() {
                if (viewportRafId) return;
                viewportRafId = window.requestAnimationFrame(function () {
                    viewportRafId = 0;
                    setVh();
                });
            }
            // 使用 screen.height 初始化一次以保证最初没有留白
            setVh();
            // 在 DOM 构建和页面加载后刷新尺寸
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', scheduleSetVh);
            }
            window.addEventListener('load', scheduleSetVh);
            window.addEventListener('resize', scheduleSetVh, { passive: true });
            window.addEventListener('orientationchange', scheduleSetVh, { passive: true });
            // visualViewport 为 Capacitor WebView 虚拟键盘弹出时使用
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', scheduleSetVh, { passive: true });
            }
        })();
    </script>

    <style>
        /* ============================================
         关键渲染路径 CSS - 优化渲染吞吐量
         ============================================ */

        /* 基础样式：确保页面始终铺满全屏 */
        html,
        body {
            height: 100%;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        /* 滚动区域：强化触控滚动和 GPU 加速 */
        #top-songs-container,
        #party-songs-container,
        .songs-scroll-area,
        [data-scrollable="true"] {
            -webkit-overflow-scrolling: touch;
            transform: translateZ(0);
            /* 强制开启 GPU 层合成 */
            contain: layout style paint;
            /* 启用隔离渲染提示 */
        }

        /* 关键动画元素：启用 GPU 加速，减少 CPU 渲染负担 */
        .animate-bar,
        .animate-spin,
        .playing-indicator {
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        /* 自定义关键帧动画 */
        @keyframes spin-reverse {
            from {
                transform: rotate(360deg);
            }

            to {
                transform: rotate(0deg);
            }
        }

        @keyframes pulse-glow {

            0%,
            100% {
                opacity: 1;
                filter: blur(0px);
            }

            50% {
                opacity: 0.8;
                filter: blur(2px);
            }
        }

        /* ============================================
         全局初始化加载状态 - 极简白屏优化
         ============================================ */

        /* 加载指示器容器 */
        .loading-spinner-container {
            position: relative;
            width: 60px;
            height: 60px;
            margin-bottom: 2rem;
        }

        /* 加载指示器旋转效果 */
        .loading-spinner {
            width: 100%;
            height: 100%;
            border: 3px solid rgba(229, 62, 62, 0.1);
            border-top-color: #e53e3e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 主要内容展示区初始化状态 */
        main {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease-in;
        }

        main.loaded {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>

    <script>
            // 加载进度条动画控制
            (function () {
                var bar = null, tm = null, p = 0, done = false;
                function step() {
                    if (done) return;
                    if (!bar) bar = document.getElementById('loading-progress');
                    if (!bar) return;
                    p = Math.min(85, (p || 0) + 7);
                    bar.style.width = p + '%';
                }
                function start() { if (tm) return; tm = setInterval(step, 300); }
                function stop() { done = true; if (tm) { clearInterval(tm); tm = null; } }
                function watch() {
                    var el = document.getElementById('app-loading-screen');
                    if (!el) return;
                    var obs = new MutationObserver(function () { if (el.classList.contains('hidden')) stop(); });
                    obs.observe(el, { attributes: true, attributeFilter: ['class'] });
                    window.__loadingProgressStop = stop;
                }
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', function () { start(); watch(); });
                } else { start(); watch(); }
            })();
    </script>

    <!-- 应用主逻辑：先清理旧脚本缓存，再加载当前版本模块 -->
    <script type="module">
        const clearLegacyRuntimeCache = async () => {
            try {
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(registrations.map((registration) => registration.unregister()));
                }
            } catch (error) {
                console.warn('[App] 清理旧 Service Worker 失败:', error);
            }

            try {
                if ('caches' in window) {
                    const keys = await caches.keys();
                    await Promise.all(keys.map((key) => caches.delete(key)));
                }
            } catch (error) {
                console.warn('[App] 清理旧缓存失败:', error);
            }
        };

        (async () => {
            await clearLegacyRuntimeCache();
            await import('./index.js?v=20260604-pad-api');
        })();
    </script>
