    <!-- 初始化默认深色主题（无用户偏好时） -->
    <script>
        (function () {
            try {
                const html = document.documentElement;
                const saved = localStorage.getItem('theme');
                const theme = saved || 'dark'; // 默认深色
                const isDark = theme === 'dark';
                html.classList.toggle('dark', isDark);
                if (isDark) {
                    html.setAttribute('data-theme', 'dark');
                } else {
                    html.removeAttribute('data-theme');
                }
                // 仅当无偏好时，保存默认值，防止后续刷新闪烁
                if (!saved) {
                    localStorage.setItem('theme', theme);
                }
                // 通知主题状态（供需要的模块使用）
                document.dispatchEvent(new CustomEvent('themeChange', {
                    detail: { isDark, theme }
                }));
            } catch (e) { }
        })();
    </script>

    <!-- 提前安装全局日志捕获 shim：在任何脚本运行前拦截所有 console 调用并入队，等待 LogService 统一输出 -->
    <script>
        (function () {
            if (window.__logShimInstalled) return;
            const debugLogs = ['localhost', '127.0.0.1'].includes(location.hostname)
                || new URLSearchParams(location.search).get('logPatch') === '1'
                || localStorage.getItem('ktv:log:patch') === '1';
            if (!debugLogs) return;
            window.__logShimInstalled = true;
            var c = window.console || {};
            // 保存原生 console 方法，供日志系统使用，避免递归
            var raw = {
                log: c.log ? c.log.bind(c) : function () { },
                info: c.info ? c.info.bind(c) : function () { },
                warn: c.warn ? c.warn.bind(c) : function () { },
                error: c.error ? c.error.bind(c) : function () { },
                debug: c.debug ? c.debug.bind(c) : function () { },
                count: c.count ? c.count.bind(c) : null
            };
            window.__rawConsole = raw;
            // 早期日志队列
            window.__earlyLogs = window.__earlyLogs || [];

            // 代理：不做格式化、不直接输出，只入队，等待 LogService 接管后统一处理
            function proxy(level) {
                return function () {
                    var args = Array.prototype.slice.call(arguments);
                    var stack;
                    try { stack = (new Error()).stack; } catch (_) { stack = undefined; }
                    window.__earlyLogs.push({ level: level, args: args, ts: Date.now(), stack: stack });
                };
            }

            // 重写全局 console，确保所有日志都先进入队列
            window.console = {
                log: proxy('info'), // 统一按 info 处理
                info: proxy('info'),
                warn: proxy('warn'),
                error: proxy('error'),
                debug: proxy('debug'),
                count: raw.count || function () { }
            };
        })();
    </script>

    <!-- 添加主题切换功能 -->
    <script>
        // 全局主题切换函数
        window.handleThemeToggleClick = function () {
            const html = document.documentElement;
            const isDark = html.classList.contains('dark');
            html.classList.toggle('dark', !isDark);
            if (!isDark) {
                html.setAttribute('data-theme', 'dark');
            } else {
                html.removeAttribute('data-theme');
            }
            localStorage.setItem('theme', !isDark ? 'dark' : 'light');
            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle) {
                const moonIcon = themeToggle.querySelector('.fa-moon');
                const sunIcon = themeToggle.querySelector('.fa-sun');
                if (moonIcon && sunIcon) {
                    moonIcon.style.display = !isDark ? 'block' : 'none';
                    sunIcon.style.display = !isDark ? 'none' : 'block';
                }
            }
            document.dispatchEvent(new CustomEvent('themeChange', {
                detail: { isDark: !isDark, theme: !isDark ? 'dark' : 'light' }
            }));
            return !isDark;
        };
    </script>

    <script>
        // 设备检测函数
        function detectDevice() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const isAndroid = /android/i.test(userAgent);
            const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(userAgent);

            if (isAndroid) document.body.classList.add('android-device');
            if (isIOS) document.body.classList.add('ios-device');
            if (isMobile) document.body.classList.add('mobile-device');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', detectDevice);
        } else {
            detectDevice();
        }

        // 禁止双击/缩放逻辑覆盖
        (function () {
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function (e) {
                const now = Date.now();
                if (now - lastTouchEnd <= 300) e.preventDefault();
                lastTouchEnd = now;
            }, { passive: false });
            document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
            document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
        })();
    </script>

        <script>
            // 轮播图逻辑
            (function() {
                const carousel = document.getElementById('carousel');
                if (!carousel) return;
                const imgs = carousel.querySelectorAll('img');
                const indicators = document.querySelectorAll('.carousel-indicator');
                let currentIndex = 0;

                function showSlide(index) {
                    imgs.forEach((img, i) => {
                        img.style.opacity = i === index ? '1' : '0';
                    });
                    indicators.forEach((ind, i) => {
                        ind.classList.toggle('bg-white', i === index);
                        ind.classList.toggle('w-4', i === index);
                        ind.classList.toggle('bg-white/40', i !== index);
                        ind.classList.toggle('w-2', i !== index);
                    });
                    currentIndex = index;
                }

                function nextSlide() {
                    let next = (currentIndex + 1) % imgs.length;
                    showSlide(next);
                }

                // 初始化
                showSlide(0);
                // 自动播放
                setInterval(nextSlide, 5000);
            })();
        </script>
