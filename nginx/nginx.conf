# ============================================================
# HVideo 点歌系统 Nginx 配置
# 功能: 反向代理、静态资源、WebSocket、负载均衡、限流
# ============================================================

# 工作进程数（建议设为 CPU 核心数）
worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log logs/access.log main;
    error_log  logs/error.log warn;

    # 性能优化
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain text/css application/json application/javascript;
    gzip_min_length    1024;

    # 请求体大小限制（文件上传）
    client_max_body_size 500m;

    # API 限流（每个 IP 每秒 10 个请求）
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # 上游 Rust 服务器
    upstream hvideo_backend {
        server 192.168.2.11:9898;
        # 如有多实例可在此添加:
        # server 127.0.0.1:3001;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  localhost;

        # 静态资源、媒体和 API 均由 Rust 服务按当前配置提供。这样 media_root
        # 可以运行时切换，并由后端统一执行路径校验和 Range 响应。
        location /media/ {
            proxy_pass http://hvideo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ---------- WebSocket 代理 ----------
        location /ws/ {
            proxy_pass http://hvideo_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ---------- API 代理 ----------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://hvideo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # 超时设置
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;

            # 文件上传相关
            proxy_request_buffering off;
        }

        # ---------- 文件下载接口（大文件走独立location） ----------
        location /api/v1/files/download/ {
            proxy_pass http://hvideo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # ---------- 健康检查 ----------
        location /health {
            proxy_pass http://hvideo_backend;
            access_log off;
        }

        # ---------- 默认页面和其它后端路由 ----------
        location / {
            proxy_pass http://hvideo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
